<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Midnight Dark Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C1A" />
      <stop offset="50%" stop-color="#091326" />
      <stop offset="100%" stop-color="#040813" />
    </linearGradient>

    <!-- Radial Cyan/Blue Atmosphere Glow -->
    <radialGradient id="cyanBlueGlow" cx="15%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#00FDFB" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#1165F9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#060C1A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightGlow" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#1165F9" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#060C1A" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#16253D" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="0" cy="0" r="1" fill="#203454" />
    </pattern>

    <!-- Official EssenByte Logo Gradient -->
    <linearGradient id="officialLogoGrad" x1="20.75" y1="256.315" x2="491.3301" y2="256.315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FDFB" />
      <stop offset="100%" stop-color="#1165F9" />
    </linearGradient>

    <!-- Badge Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B33" />
      <stop offset="100%" stop-color="#081224" />
    </linearGradient>

    <!-- Drop Shadow Filter for Official Mark -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#00FDFB" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#1165F9" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="14" />
  <rect width="1200" height="340" fill="url(#cyanBlueGlow)" rx="14" />
  <rect width="1200" height="340" fill="url(#rightGlow)" rx="14" />
  <rect width="1200" height="340" fill="url(#techGrid)" rx="14" />

  <!-- Outer Precision Border -->
  <rect x="1" y="1" width="1198" height="338" fill="none" stroke="#1B2D4A" stroke-width="1.5" rx="14" />

  <!-- Corner Brackets -->
  <path d="M 25 45 L 25 25 L 45 25" fill="none" stroke="#00FDFB" stroke-width="2" />
  <path d="M 1175 45 L 1175 25 L 1155 25" fill="none" stroke="#1E3354" stroke-width="2" />
  <path d="M 25 295 L 25 315 L 45 315" fill="none" stroke="#1E3354" stroke-width="2" />
  <path d="M 1175 295 L 1175 315 L 1155 315" fill="none" stroke="#1165F9" stroke-width="2" />

  <!-- Top Metadata Header Line -->
  <g transform="translate(60, 48)">
    <circle cx="0" cy="0" r="3.5" fill="#00FDFB" />
    <text x="14" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2.5" fill="#8FA4C7">
      ORG ID: ESSENBYTE SOLUTIONS <tspan fill="#24375A">|</tspan> DIGITAL INFRASTRUCTURE &amp; PLATFORMS <tspan fill="#24375A">|</tspan> EST. BUCHAREST
    </text>
    <line x1="880" y1="0" x2="1080" y2="0" stroke="#1B2D4A" stroke-width="1" />
    <circle cx="1080" cy="0" r="2" fill="#00FDFB" />
  </g>

  <!-- Left Side: OFFICIAL ESSENBYTE EMBLEM (512x512 scaled) -->
  <g transform="translate(56, 85)">
    <!-- Container Card -->
    <rect x="0" y="0" width="140" height="140" rx="20" fill="url(#cardGrad)" stroke="#1B2D4A" stroke-width="1.5" />
    
    <!-- Official Logo Vector scaled to fit nicely -->
    <g transform="translate(16, 16) scale(0.21)" filter="url(#logoGlow)">
      <path d="m491.3301,329.92c0,76.6-56.6001,138.58-126.5801,138.58h-93.74l79.3401-81h12.4099c25.9299,0,46.88-21.48,46.88-48,0-30.4-20.9501-55-46.88-55h-154.36l78.08-79h14.76c24.89,0,45.05-17.56,45.05-39.25,0-23.63-15.6801-42.75-35.05-42.75h-41.48l76.53-77.32c44.09,16.74,84.34,57.21,80.8199,106.38l.39,23.84c-.02,14.06-3.9299,28.36-12.35,39.75,9.77,4.59,19.02,10.28,27.5,16.94,29.66,23.3199,48.6801,58.78,48.6801,96.83Zm-355.8301,59.58v-61H53.5v142l175.12-1.29,79.04-79.71h-172.16ZM306.45,42.5l-205.8099-.37L20.75,123.5l205.4399.37,80.26-81.37ZM53.5,166.5v118l112,1.47,81.21-80.47h-111.21v-39H53.5Z" fill="url(#officialLogoGrad)"/>
    </g>
  </g>

  <!-- Center Main Titles -->
  <g transform="translate(225, 115)">
    <!-- Brand Title -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" fill="#EFF5FF">
      EssenByte<tspan fill="#00FDFB">.</tspan><tspan fill="#84ACEE">Solutions</tspan>
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#95A5C6" letter-spacing="0.2">
      You imagine it, we build it. Scalable digital platforms, hardened backend systems &amp; operational infrastructure.
    </text>

    <!-- Pillar Badges Pill Group -->
    <g transform="translate(0, 80)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="180" height="28" rx="6" fill="#0C172B" stroke="#1B2D4A" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#00FDFB" />
      <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="600" fill="#EFF5FF" letter-spacing="0.8">SOFTWARE SYSTEMS</text>

      <!-- Badge 2 -->
      <rect x="192" y="0" width="185" height="28" rx="6" fill="#0C172B" stroke="#1B2D4A" stroke-width="1" />
      <circle cx="206" cy="14" r="3.5" fill="#1165F9" />
      <text x="218" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="600" fill="#EFF5FF" letter-spacing="0.8">CLOUD INFRASTRUCTURE</text>

      <!-- Badge 3 -->
      <rect x="389" y="0" width="185" height="28" rx="6" fill="#0C172B" stroke="#1B2D4A" stroke-width="1" />
      <circle cx="403" cy="14" r="3.5" fill="#00FDFB" />
      <text x="415" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="600" fill="#EFF5FF" letter-spacing="0.8">SECURITY &amp; HARDENING</text>

      <!-- Badge 4 -->
      <rect x="586" y="0" width="180" height="28" rx="6" fill="#0C172B" stroke="#1B2D4A" stroke-width="1" />
      <circle cx="600" cy="14" r="3.5" fill="#1165F9" />
      <text x="612" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="600" fill="#EFF5FF" letter-spacing="0.8">HARDWARE &amp; ROBOTICS</text>
    </g>
  </g>

  <!-- Right Visual Spec Panel -->
  <g transform="translate(1015, 88)">
    <rect x="0" y="0" width="125" height="150" rx="10" fill="#0A1526" stroke="#1B2D4A" stroke-width="1" />
    <path d="M 0 0 L 125 0 L 125 32 L 0 32 Z" fill="#0F1F38" rx="10" />
    <text x="14" y="20" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#8FA4C7" letter-spacing="1">STATUS</text>
    <circle cx="106" cy="16" r="4" fill="#00FDFB" />

    <text x="14" y="54" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#5E7599">AVAILABILITY</text>
    <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#EFF5FF">99.98%</text>

    <text x="14" y="94" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#5E7599">DEPLOYED APIS</text>
    <text x="14" y="108" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#EFF5FF">v1 / PROD</text>

    <text x="14" y="132" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#00FDFB">● ALL SYSTEMS GO</text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="60" y1="285" x2="1140" y2="285" stroke="#1B2D4A" stroke-width="1" />
  
  <g transform="translate(60, 308)">
    <text x="0" y="0" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#6982A8" letter-spacing="1.5">
      CORE STACK: <tspan fill="#EFF5FF">NEXT.JS</tspan> · <tspan fill="#EFF5FF">PYTHON API</tspan> · <tspan fill="#EFF5FF">MARIADB</tspan> · <tspan fill="#EFF5FF">REDIS</tspan> · <tspan fill="#EFF5FF">DOCKER</tspan> · <tspan fill="#EFF5FF">LINUX VPS</tspan> · <tspan fill="#EFF5FF">CLOUDFLARE</tspan>
    </text>
  </g>

  <g transform="translate(1015, 308)">
    <text x="125" y="0" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#00FDFB" text-anchor="end" letter-spacing="1">
      ESSENBYTE.COM ↗
    </text>
  </g>
</svg>
