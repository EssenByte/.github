<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" height="100%">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C1A" />
      <stop offset="100%" stop-color="#0A1628" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1C33" />
      <stop offset="100%" stop-color="#091324" />
    </linearGradient>

    <pattern id="wfDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#1C2D4A" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="230" rx="12" fill="url(#wfBg)" stroke="#1D2E4D" stroke-width="1.5" />
  <rect width="1200" height="230" rx="12" fill="url(#wfDots)" />

  <!-- Top Title Bar -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Mono', monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#50BFFC">
      // END-TO-END EXECUTION PIPELINE
    </text>
    <text x="290" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#6E85A8">
      — How EssenByte builds dependable production systems from zero to continuous operation
    </text>
  </g>

  <!-- Connecting Pipeline Line -->
  <line x1="80" y1="125" x2="1120" y2="125" stroke="#1D2E4D" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Step 1: Architect -->
  <g transform="translate(40, 55)">
    <rect width="210" height="140" rx="8" fill="url(#cardBg)" stroke="#1D2E4D" stroke-width="1.2" />
    <rect x="0" y="0" width="210" height="4" rx="2" fill="#2A4570" />
    <g transform="translate(16, 26)">
      <text x="0" y="0" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#50BFFC" letter-spacing="1">STAGE 01</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#EFF5FF">Architecture &amp; Data</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#95A5C6">
        <tspan x="0" dy="0">• Domain modeling</tspan>
        <tspan x="0" dy="16">• Relational schema (MariaDB)</tspan>
        <tspan x="0" dy="16">• REST API spec (/api/v1)</tspan>
      </text>
    </g>
  </g>

  <!-- Step 2: Build -->
  <g transform="translate(268, 55)">
    <rect width="210" height="140" rx="8" fill="url(#cardBg)" stroke="#1D2E4D" stroke-width="1.2" />
    <rect x="0" y="0" width="210" height="4" rx="2" fill="#3169ED" />
    <g transform="translate(16, 26)">
      <text x="0" y="0" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#50BFFC" letter-spacing="1">STAGE 02</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#EFF5FF">Full-Stack Core</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#95A5C6">
        <tspan x="0" dy="0">• Next.js reactive frontend</tspan>
        <tspan x="0" dy="16">• Asynchronous Python API</tspan>
        <tspan x="0" dy="16">• Redis queues &amp; WebSockets</tspan>
      </text>
    </g>
  </g>

  <!-- Step 3: Harden -->
  <g transform="translate(496, 55)">
    <rect width="210" height="140" rx="8" fill="url(#cardBg)" stroke="#1D2E4D" stroke-width="1.2" />
    <rect x="0" y="0" width="210" height="4" rx="2" fill="#50BFFC" />
    <g transform="translate(16, 26)">
      <text x="0" y="0" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#50BFFC" letter-spacing="1">STAGE 03</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#EFF5FF">Security &amp; RBAC</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#95A5C6">
        <tspan x="0" dy="0">• HttpOnly &amp; CSRF protection</tspan>
        <tspan x="0" dy="16">• Strict Role-Based Access</tspan>
        <tspan x="0" dy="16">• Rate limiting &amp; encryption</tspan>
      </text>
    </g>
  </g>

  <!-- Step 4: Deploy -->
  <g transform="translate(724, 55)">
    <rect width="210" height="140" rx="8" fill="url(#cardBg)" stroke="#1D2E4D" stroke-width="1.2" />
    <rect x="0" y="0" width="210" height="4" rx="2" fill="#2A4570" />
    <g transform="translate(16, 26)">
      <text x="0" y="0" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#50BFFC" letter-spacing="1">STAGE 04</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#EFF5FF">Infrastructure</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#95A5C6">
        <tspan x="0" dy="0">• Docker multi-container</tspan>
        <tspan x="0" dy="16">• Nginx / Reverse proxy</tspan>
        <tspan x="0" dy="16">• Cloudflare CDN &amp; SSL</tspan>
      </text>
    </g>
  </g>

  <!-- Step 5: Operate -->
  <g transform="translate(952, 55)">
    <rect width="208" height="140" rx="8" fill="url(#cardBg)" stroke="#1D2E4D" stroke-width="1.2" />
    <rect x="0" y="0" width="208" height="4" rx="2" fill="#3169ED" />
    <g transform="translate(16, 26)">
      <text x="0" y="0" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#50BFFC" letter-spacing="1">STAGE 05</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#EFF5FF">Operations &amp; Scale</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#95A5C6">
        <tspan x="0" dy="0">• Offsite automated backups</tspan>
        <tspan x="0" dy="16">• Continuous logging &amp; health</tspan>
        <tspan x="0" dy="16">• Zero-downtime iterations</tspan>
      </text>
    </g>
  </g>
</svg>
